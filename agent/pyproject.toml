[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashborne-agent"
version = "0.1.0"
description = "Typed local-host adversary-emulation lab agent for ASHBORNE"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ASHBORNE Contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<3",
  "librt>=0.15,<1; python_version >= '3.13'",
  "types-psutil>=6,<8",
  "build>=1,<2",
]

[project.scripts]
ashborne-agent = "ashborne_agent.main:main"

[tool.setuptools.packages.find]
include = ["ashborne_agent*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["ashborne_agent"]

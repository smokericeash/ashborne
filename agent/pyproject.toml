[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kandor-agent"
version = "0.1.0"
description = "Safe, allowlisted diagnostics agent for KANDOR"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KANDOR Contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<3",
  "librt>=0.15,<1; python_version >= '3.13'",
  "types-psutil>=6,<8",
  "build>=1,<2",
]

[project.scripts]
kandor-agent = "kandor_agent.main:main"

[tool.setuptools.packages.find]
include = ["kandor_agent*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["kandor_agent"]

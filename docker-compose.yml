name: ashborne

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  ashborne-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ASHBORNE_DB_USER: ${ASHBORNE_DB_USER:?Set ASHBORNE_DB_USER in .env}
      ASHBORNE_DB_PASSWORD: ${ASHBORNE_DB_PASSWORD:?Set ASHBORNE_DB_PASSWORD in .env}
    volumes:
      - ashborne-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-ashborne-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - ashborne-data
    logging: *default-logging

  ashborne-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - ashborne-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - ashborne-data
    logging: *default-logging

  ashborne-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ashborne-backend:local
    restart: unless-stopped
    environment:
      ASHBORNE_ENVIRONMENT: ${ASHBORNE_ENVIRONMENT:-development}
      ASHBORNE_DEBUG: ${ASHBORNE_DEBUG:-false}
      ASHBORNE_LOG_LEVEL: ${ASHBORNE_LOG_LEVEL:-INFO}
      ASHBORNE_AUTO_CREATE_TABLES: ${ASHBORNE_AUTO_CREATE_TABLES:-false}
      ASHBORNE_DATABASE_URL: ${ASHBORNE_DATABASE_URL:?Set ASHBORNE_DATABASE_URL in .env}
      ASHBORNE_REDIS_URL: ${ASHBORNE_REDIS_URL:?Set ASHBORNE_REDIS_URL in .env}
      ASHBORNE_SECRET_KEY: ${ASHBORNE_SECRET_KEY:?Set ASHBORNE_SECRET_KEY in .env}
      ASHBORNE_JWT_ISSUER: ${ASHBORNE_JWT_ISSUER:-ashborne}
      ASHBORNE_JWT_AUDIENCE: ${ASHBORNE_JWT_AUDIENCE:-ashborne-ui}
      ASHBORNE_SESSION_TIMEOUT_MINUTES: ${ASHBORNE_SESSION_TIMEOUT_MINUTES:-60}
      ASHBORNE_REFRESH_TOKEN_DAYS: ${ASHBORNE_REFRESH_TOKEN_DAYS:-7}
      ASHBORNE_CORS_ORIGINS: ${ASHBORNE_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ASHBORNE_TRUSTED_HOSTS: ${ASHBORNE_TRUSTED_HOSTS:-localhost,127.0.0.1,ashborne-backend}
      ASHBORNE_MAX_REQUEST_BYTES: ${ASHBORNE_MAX_REQUEST_BYTES:-1048576}
      ASHBORNE_RATE_LIMIT_REQUESTS: ${ASHBORNE_RATE_LIMIT_REQUESTS:-300}
      ASHBORNE_RATE_LIMIT_WINDOW_SECONDS: ${ASHBORNE_RATE_LIMIT_WINDOW_SECONDS:-60}
      ASHBORNE_LOGIN_RATE_LIMIT_REQUESTS: ${ASHBORNE_LOGIN_RATE_LIMIT_REQUESTS:-10}
      ASHBORNE_HEARTBEAT_INTERVAL_SECONDS: ${ASHBORNE_HEARTBEAT_INTERVAL_SECONDS:-30}
      ASHBORNE_DEGRADED_THRESHOLD_SECONDS: ${ASHBORNE_DEGRADED_THRESHOLD_SECONDS:-60}
      ASHBORNE_OFFLINE_THRESHOLD_SECONDS: ${ASHBORNE_OFFLINE_THRESHOLD_SECONDS:-300}
      ASHBORNE_TASK_EXPIRATION_SECONDS: ${ASHBORNE_TASK_EXPIRATION_SECONDS:-3600}
      ASHBORNE_KALI_CONTROLLER_AGENT_ID: ${ASHBORNE_KALI_CONTROLLER_AGENT_ID:-}
      ASHBORNE_PAGE_SIZE: ${ASHBORNE_PAGE_SIZE:-25}
      ASHBORNE_AUDIT_RETENTION_DAYS: ${ASHBORNE_AUDIT_RETENTION_DAYS:-365}
      ASHBORNE_SEED_DEVELOPMENT: ${ASHBORNE_SEED_DEVELOPMENT:-false}
      ASHBORNE_ADMIN_PASSWORD: ${ASHBORNE_ADMIN_PASSWORD:-}
      ASHBORNE_OPERATOR_PASSWORD: ${ASHBORNE_OPERATOR_PASSWORD:-}
      ASHBORNE_VIEWER_PASSWORD: ${ASHBORNE_VIEWER_PASSWORD:-}
      ASHBORNE_DEMO_BOOTSTRAP_SECRET: ${ASHBORNE_DEMO_BOOTSTRAP_SECRET:-}
      ASHBORNE_FORWARDED_ALLOW_IPS: ${ASHBORNE_FORWARDED_ALLOW_IPS:-172.30.254.10}
    depends_on:
      ashborne-postgres:
        condition: service_healthy
      ashborne-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ASHBORNE_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ashborne-data
      - ashborne-agent
      - ashborne-proxy
    logging: *default-logging

  ashborne-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: ashborne-frontend:local
    restart: unless-stopped
    depends_on:
      ashborne-backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ASHBORNE_UI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      ashborne-proxy:
        ipv4_address: ${ASHBORNE_FRONTEND_PROXY_IP:-172.30.254.10}
    logging: *default-logging

  ashborne-agent:
    profiles: ["demo"]
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: ashborne-agent:local
    restart: unless-stopped
    environment:
      ASHBORNE_SERVER_URL: http://ashborne-backend:8000
      # Keep interpolation optional so production can omit this development-only
      # secret while the demo profile is inactive. The agent rejects an empty
      # value if the profile is explicitly started.
      ASHBORNE_DEMO_BOOTSTRAP_SECRET: ${ASHBORNE_DEMO_BOOTSTRAP_SECRET:-}
      ASHBORNE_CONFIG: /var/lib/ashborne/agent.json
      ASHBORNE_HEARTBEAT_INTERVAL: ${ASHBORNE_HEARTBEAT_INTERVAL:-30}
      ASHBORNE_POLL_INTERVAL: ${ASHBORNE_POLL_INTERVAL:-5}
      ASHBORNE_LOG_LEVEL: ${ASHBORNE_LOG_LEVEL:-INFO}
      ASHBORNE_ALLOW_INSECURE_HTTP: "true"
    depends_on:
      ashborne-backend:
        condition: service_healthy
    volumes:
      - /var/lib/ashborne
      - /var/log/ashborne
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ashborne-agent
    logging: *default-logging

volumes:
  ashborne-postgres-data:
  ashborne-redis-data:

networks:
  ashborne-data:
    driver: bridge
    internal: true
  ashborne-agent:
    driver: bridge
    internal: true
  ashborne-proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${ASHBORNE_PROXY_SUBNET:-172.30.254.0/28}

name: kandor

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  kandor-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KANDOR_DB_USER: ${KANDOR_DB_USER:?Set KANDOR_DB_USER in .env}
      KANDOR_DB_PASSWORD: ${KANDOR_DB_PASSWORD:?Set KANDOR_DB_PASSWORD in .env}
    volumes:
      - kandor-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-kandor-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - kandor-data
    logging: *default-logging

  kandor-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - kandor-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - kandor-data
    logging: *default-logging

  kandor-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kandor-backend:local
    restart: unless-stopped
    environment:
      KANDOR_ENVIRONMENT: ${KANDOR_ENVIRONMENT:-development}
      KANDOR_DEBUG: ${KANDOR_DEBUG:-false}
      KANDOR_LOG_LEVEL: ${KANDOR_LOG_LEVEL:-INFO}
      KANDOR_AUTO_CREATE_TABLES: ${KANDOR_AUTO_CREATE_TABLES:-false}
      KANDOR_DATABASE_URL: ${KANDOR_DATABASE_URL:?Set KANDOR_DATABASE_URL in .env}
      KANDOR_REDIS_URL: ${KANDOR_REDIS_URL:?Set KANDOR_REDIS_URL in .env}
      KANDOR_SECRET_KEY: ${KANDOR_SECRET_KEY:?Set KANDOR_SECRET_KEY in .env}
      KANDOR_JWT_ISSUER: ${KANDOR_JWT_ISSUER:-kandor}
      KANDOR_JWT_AUDIENCE: ${KANDOR_JWT_AUDIENCE:-kandor-ui}
      KANDOR_SESSION_TIMEOUT_MINUTES: ${KANDOR_SESSION_TIMEOUT_MINUTES:-60}
      KANDOR_REFRESH_TOKEN_DAYS: ${KANDOR_REFRESH_TOKEN_DAYS:-7}
      KANDOR_CORS_ORIGINS: ${KANDOR_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      KANDOR_TRUSTED_HOSTS: ${KANDOR_TRUSTED_HOSTS:-localhost,127.0.0.1,kandor-backend}
      KANDOR_MAX_REQUEST_BYTES: ${KANDOR_MAX_REQUEST_BYTES:-1048576}
      KANDOR_RATE_LIMIT_REQUESTS: ${KANDOR_RATE_LIMIT_REQUESTS:-300}
      KANDOR_RATE_LIMIT_WINDOW_SECONDS: ${KANDOR_RATE_LIMIT_WINDOW_SECONDS:-60}
      KANDOR_LOGIN_RATE_LIMIT_REQUESTS: ${KANDOR_LOGIN_RATE_LIMIT_REQUESTS:-10}
      KANDOR_HEARTBEAT_INTERVAL_SECONDS: ${KANDOR_HEARTBEAT_INTERVAL_SECONDS:-30}
      KANDOR_DEGRADED_THRESHOLD_SECONDS: ${KANDOR_DEGRADED_THRESHOLD_SECONDS:-60}
      KANDOR_OFFLINE_THRESHOLD_SECONDS: ${KANDOR_OFFLINE_THRESHOLD_SECONDS:-300}
      KANDOR_TASK_EXPIRATION_SECONDS: ${KANDOR_TASK_EXPIRATION_SECONDS:-3600}
      KANDOR_PAGE_SIZE: ${KANDOR_PAGE_SIZE:-25}
      KANDOR_AUDIT_RETENTION_DAYS: ${KANDOR_AUDIT_RETENTION_DAYS:-365}
      KANDOR_SEED_DEVELOPMENT: ${KANDOR_SEED_DEVELOPMENT:-false}
      KANDOR_ADMIN_PASSWORD: ${KANDOR_ADMIN_PASSWORD:-}
      KANDOR_OPERATOR_PASSWORD: ${KANDOR_OPERATOR_PASSWORD:-}
      KANDOR_VIEWER_PASSWORD: ${KANDOR_VIEWER_PASSWORD:-}
      KANDOR_DEMO_BOOTSTRAP_SECRET: ${KANDOR_DEMO_BOOTSTRAP_SECRET:-}
      KANDOR_FORWARDED_ALLOW_IPS: ${KANDOR_FORWARDED_ALLOW_IPS:-172.30.254.10}
    depends_on:
      kandor-postgres:
        condition: service_healthy
      kandor-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KANDOR_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - kandor-data
      - kandor-agent
      - kandor-proxy
    logging: *default-logging

  kandor-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: kandor-frontend:local
    restart: unless-stopped
    depends_on:
      kandor-backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KANDOR_UI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      kandor-proxy:
        ipv4_address: ${KANDOR_FRONTEND_PROXY_IP:-172.30.254.10}
    logging: *default-logging

  kandor-agent:
    profiles: ["demo"]
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: kandor-agent:local
    restart: unless-stopped
    environment:
      KANDOR_SERVER_URL: http://kandor-backend:8000
      # Keep interpolation optional so production can omit this development-only
      # secret while the demo profile is inactive. The agent rejects an empty
      # value if the profile is explicitly started.
      KANDOR_DEMO_BOOTSTRAP_SECRET: ${KANDOR_DEMO_BOOTSTRAP_SECRET:-}
      KANDOR_CONFIG: /var/lib/kandor/agent.json
      KANDOR_HEARTBEAT_INTERVAL: ${KANDOR_HEARTBEAT_INTERVAL:-30}
      KANDOR_POLL_INTERVAL: ${KANDOR_POLL_INTERVAL:-5}
      KANDOR_LOG_LEVEL: ${KANDOR_LOG_LEVEL:-INFO}
      KANDOR_ALLOW_INSECURE_HTTP: "true"
    depends_on:
      kandor-backend:
        condition: service_healthy
    volumes:
      - /var/lib/kandor
      - /var/log/kandor
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - kandor-agent
    logging: *default-logging

volumes:
  kandor-postgres-data:
  kandor-redis-data:

networks:
  kandor-data:
    driver: bridge
    internal: true
  kandor-agent:
    driver: bridge
    internal: true
  kandor-proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${KANDOR_PROXY_SUBNET:-172.30.254.0/28}
